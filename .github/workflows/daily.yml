name: Daily Chancery Brief

on:
  schedule:
      - cron: '30 22 * * 0,3'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-brief
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install
        run: pip install anthropic

      - name: Build the brief
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
          MAX_SEARCHES: ${{ vars.MAX_SEARCHES }}
          TZ: Asia/Shanghai
        run: python build.py

      - name: Publish
        run: |
          mkdir -p docs data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs data
          git diff --cached --quiet || git commit -m "Daily brief"
          git push
